<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sunset Blues Radio</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#111111">
  <meta name="description" content="Sunset Blues Radio live stream">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #050505, #221207, #3b210d);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 90%;
      max-width: 430px;
      text-align: center;
      padding: 28px;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.5);
    }

    .cover {
      width: 185px;
      height: 185px;
      object-fit: cover;
      border-radius: 30px;
      margin-bottom: 22px;
      background: #222222;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .station {
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 10px;
    }

    .title {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .artist {
      font-size: 18px;
      opacity: 0.85;
      margin-bottom: 26px;
    }

    .play {
      border: none;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #f5b041;
      color: #111111;
      margin-bottom: 24px;
    }

    .volume-label {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 8px;
    }

    .volume {
      width: 100%;
      max-width: 300px;
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.75;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      opacity: 0.55;
    }
  </style>
</head>

<body>

  <main class="app">
    <img id="albumCover" class="cover" src="icon-512.png" alt="Sunset Blues Radio">

    <div class="station">Sunset Blues Radio</div>

    <div id="songTitle" class="title">Live Stream</div>
    <div id="artistName" class="artist">Blues Radio</div>

    <button id="playButton" class="play">▶ Play</button>

    <div class="volume-label">Volume</div>
    <input id="volumeControl" class="volume" type="range" min="0" max="1" step="0.01" value="0.8">

    <div id="status" class="status">Ready</div>

    <div class="footer">Live Blues, Blues-Rock and more</div>

    <audio id="radioAudio" preload="none"></audio>
  </main>

  <script>
    var STREAM_URL = "https://securestreams.autopo.st:2635/;";
    var STATS_URL = "https://securestreams.autopo.st:2635/statistics?json=1";

    var audio = document.getElementById("radioAudio");
    var playButton = document.getElementById("playButton");
    var volumeControl = document.getElementById("volumeControl");
    var statusText = document.getElementById("status");
    var songTitle = document.getElementById("songTitle");
    var artistName = document.getElementById("artistName");
    var albumCover = document.getElementById("albumCover");

    var defaultCover = "icon-512.png";
    var lastTrack = "";
    var userWantsToPlay = false;
    var reconnectTimer = null;
    var reconnectAttempts = 0;
    var maxReconnectAttempts = 10;

    audio.src = STREAM_URL;
    audio.volume = volumeControl.value;

    function setStatus(message) {
      statusText.textContent = message;
    }

    function resetAudioSource() {
      audio.pause();
      audio.src = STREAM_URL + "?nocache=" + new Date().getTime();
      audio.load();
    }

    function startPlayback() {
      userWantsToPlay = true;
      setStatus("Connecting...");

      audio.play().then(function () {
        playButton.textContent = "⏸ Pause";
        setStatus("Playing");
        reconnectAttempts = 0;
      }).catch(function (error) {
        setStatus("Playback blocked or stream unavailable");
        playButton.textContent = "▶ Play";
        console.log("Playback error:", error);
      });
    }

    function stopPlayback() {
      userWantsToPlay = false;
      audio.pause();
      playButton.textContent = "▶ Play";
      setStatus("Paused");

      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
    }

    function scheduleReconnect(reason) {
      if (!userWantsToPlay) {
        return;
      }

      if (reconnectTimer) {
        return;
      }

      if (reconnectAttempts >= maxReconnectAttempts) {
        setStatus("Stream interrupted. Tap Play to reconnect.");
        playButton.textContent = "▶ Play";
        userWantsToPlay = false;
        return;
      }

      reconnectAttempts = reconnectAttempts + 1;
      setStatus("Reconnecting... attempt " + reconnectAttempts);

      reconnectTimer = setTimeout(function () {
        reconnectTimer = null;
        resetAudioSource();

        audio.play().then(function () {
          playButton.textContent = "⏸ Pause";
          setStatus("Playing");
          reconnectAttempts = 0;
        }).catch(function (error) {
          console.log("Reconnect failed:", reason, error);
          scheduleReconnect("retry");
        });
      }, 3000);
    }

    playButton.addEventListener("click", function () {
      if (audio.paused) {
        startPlayback();
      } else {
        stopPlayback();
      }
    });

    volumeControl.addEventListener("input", function () {
      audio.volume = volumeControl.value;
    });

    audio.addEventListener("playing", function () {
      setStatus("Playing");
      reconnectAttempts = 0;
    });

    audio.addEventListener("waiting", function () {
      if (userWantsToPlay) {
        setStatus("Buffering...");
      }
    });

    audio.addEventListener("stalled", function () {
      scheduleReconnect("stalled");
    });

    audio.addEventListener("error", function () {
      scheduleReconnect("error");
    });

    audio.addEventListener("ended", function () {
      scheduleReconnect("ended");
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && userWantsToPlay && audio.paused) {
        scheduleReconnect("visibilitychange");
      }
    });

    window.addEventListener("online", function () {
      if (userWantsToPlay && audio.paused) {
        scheduleReconnect("online");
      }
    });

    function splitArtistTitle(rawTitle) {
      if (!rawTitle) {
        return {
          artist: "Sunset Blues Radio",
          title: "Live Stream"
        };
      }

      var separators = [" - ", " – ", " — "];

      for (var i = 0; i < separators.length; i++) {
        var separator = separators[i];

        if (rawTitle.indexOf(separator) !== -1) {
          var parts = rawTitle.split(separator);

          return {
            artist: parts[0].trim(),
            title: parts.slice(1).join(separator).trim()
          };
        }
      }

      return {
        artist: "Sunset Blues Radio",
        title: rawTitle.trim()
      };
    }

    function updateAlbumCover(artist, title) {
      if (!artist || !title || artist === "Sunset Blues Radio" || title === "Live Stream") {
        albumCover.src = defaultCover;
        return;
      }

      var query = encodeURIComponent(artist + " " + title);
      var url = "https://itunes.apple.com/search?term=" + query + "&media=music&entity=song&limit=1";

      fetch(url).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.resultCount > 0 && data.results[0].artworkUrl100) {
          var artwork = data.results[0].artworkUrl100.replace("100x100bb", "512x512bb");
          albumCover.src = artwork;
        } else {
          albumCover.src = defaultCover;
        }
      }).catch(function () {
        albumCover.src = defaultCover;
      });
    }

    function updateNowPlaying() {
      fetch(STATS_URL).then(function (response) {
        return response.json();
      }).then(function (data) {
        var rawTitle = "";

        if (data.streams && data.streams.length > 0) {
          rawTitle = data.streams[0].songtitle || "";
        } else if (data.songtitle) {
          rawTitle = data.songtitle;
        }

        var track = splitArtistTitle(rawTitle);
        var currentTrack = track.artist + " - " + track.title;

        songTitle.textContent = track.title;
        artistName.textContent = track.artist;

        if (currentTrack !== lastTrack) {
          lastTrack = currentTrack;
          updateAlbumCover(track.artist, track.title);
        }
      }).catch(function () {
        songTitle.textContent = "Live Stream";
        artistName.textContent = "Sunset Blues Radio";
      });
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 15000);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
