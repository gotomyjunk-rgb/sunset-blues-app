<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sunset Blues Radio</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#111111">
  <meta name="description" content="Sunset Blues Radio live stream">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #050505, #221207, #3b210d);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 90%;
      max-width: 430px;
      text-align: center;
      padding: 28px;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 185px;
      height: 185px;
      object-fit: cover;
      border-radius: 30px;
      margin-bottom: 22px;
      background: #222222;
    }

    .station {
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 10px;
    }

    .title {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .artist {
      font-size: 18px;
      opacity: 0.85;
      margin-bottom: 26px;
    }

    .play {
      border: none;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #f5b041;
      color: #111111;
      margin-bottom: 24px;
    }

    .play:active {
      transform: scale(0.98);
    }

    .volume-label {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 8px;
    }

    .volume {
      width: 100%;
      max-width: 300px;
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.7;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      opacity: 0.55;
    }
  </style>
</head>

<body>

  <main class="app">
    <img class="logo" src="icon-512.png" alt="Sunset Blues Radio">

    <div class="station">Sunset Blues Radio</div>

    <div id="songTitle" class="title">Live Stream</div>
    <div id="artistName" class="artist">Blues Radio</div>

    <button id="playButton" class="play">▶ Play</button>

    <div class="volume-label">Volume</div>
    <input id="volumeControl" class="volume" type="range" min="0" max="1" step="0.01" value="0.8">

    <div id="status" class="status">Ready</div>

    <div class="footer">Live Blues, Blues-Rock and more</div>

    <audio id="radioAudio" preload="none">
      <source src="https://securestreams.autopo.st:2635/;" type="audio/mpeg">
    </audio>
  </main>

  <script>
    const audio = document.getElementById("radioAudio");
    const playButton = document.getElementById("playButton");
    const volumeControl = document.getElementById("volumeControl");
    const statusText = document.getElementById("status");
    const songTitle = document.getElementById("songTitle");
    const artistName = document.getElementById("artistName");

    audio.volume = volumeControl.value;

    playButton.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          statusText.textContent = "Connecting...";
          await audio.play();
          playButton.textContent = "⏸ Pause";
          statusText.textContent = "Playing";
        } catch (error) {
          statusText.textContent = "Playback blocked or stream unavailable";
          playButton.textContent = "▶ Play";
          console.error("Playback error:", error);
        }
      } else {
        audio.pause();
        playButton.textContent = "▶ Play";
        statusText.textContent = "Paused";
      }
    });

    volumeControl.addEventListener("input", () => {
      audio.volume = volumeControl.value;
    });

    function splitArtistTitle(rawTitle) {
      if (!rawTitle) {
        return {
          artist: "Sunset Blues Radio",
          title: "Live Stream"
        };
      }

      const separators = [" - ", " – ", " — "];

      for (const separator of separators) {
        if (rawTitle.includes(separator)) {
          const parts = rawTitle.split(separator);
          return {
            artist: parts[0].trim(),
            title: parts.slice(1).join(separator).trim()
          };
        }
      }

      return {
        artist: "Sunset Blues Radio",
        title: rawTitle.trim()
      };
    }

    async function updateNowPlaying() {
      try {
        const response = await fetch("https://securestreams.autopo.st:2635/statistics?json=1");
        const data = await response.json();

        let rawTitle = "";

        if (data.streams && data.streams.length > 0) {
          rawTitle = data.streams[0].songtitle || "";
        } else if (data.songtitle) {
          rawTitle = data.songtitle;
        }

        const track = splitArtistTitle(rawTitle);

        songTitle.textContent = track.title;
        artistName.textContent = track.artist;

      } catch (error) {
        songTitle.textContent = "Live Stream";
        artistName.textContent = "Sunset Blues Radio";
      }
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 15000);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
